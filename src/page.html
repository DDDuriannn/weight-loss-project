<div class="challenge-page">
  <header class="masthead">
    <div class="masthead-brand">
      <span class="masthead-avatar-wrap"><span class="masthead-emoji" role="img" aria-label="小丑">🤡</span></span>
      <div class="masthead-copy"><div class="masthead-title-row"><span class="masthead-title"><!-- BRAND --></span></div></div>
    </div>
    <div class="masthead-side">
      <button class="call-open" type="button" data-role="call-open" aria-label="为zwh拨打120" title="为zwh拨打120" aria-haspopup="dialog" aria-controls="call-screen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.1 3.5h2.5l1.2 4.3-2.2 1.6a15.6 15.6 0 0 0 6 6l1.6-2.2 4.3 1.2v2.5c0 2.2-1.9 3.6-4 3C9.6 18.8 5.2 14.4 3.8 7.5c-.6-2.1.8-4 3.3-4Z"/></svg>
      </button>
      <button class="theme-toggle" type="button" data-role="theme-toggle" aria-label="切换明暗主题" title="切换明暗主题">
        <span class="theme-toggle-icons" aria-hidden="true">
          <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
          <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </header>
  <main>
    <section class="challenge-hero" aria-labelledby="challenge-title">
      <h1 id="challenge-title"><!-- OWNER --> 的 <span>28 天减肥计划</span></h1>
      <p class="challenge-period"><!-- PERIOD --></p>
    </section>
    <aside class="challenge-score" aria-label="北京时间与挑战进度" data-challenge-clock data-start="{{startDate}}" data-days="{{totalDays}}" data-locale="zh-CN">
      <div class="challenge-score-rings" aria-hidden="true"><i></i><i></i></div>
      <div class="challenge-score-sheet">
        <span class="challenge-time-label">今天</span>
        <span class="challenge-score-tag" data-clock-date><!-- TODAY --></span>
        <span class="challenge-calendar-label">挑战日</span>
        <div class="challenge-score-number" data-clock-day><!-- DAY --></div>
        <p class="challenge-calendar-note"><!-- PROGRESS --></p>
        <div class="challenge-clock">
          <time class="challenge-clock-time" data-clock-time datetime="{{now}}"><!-- TIME --></time>
          <span class="challenge-clock-zone">北京时间</span>
          <span class="challenge-clock-label">北京时间 · UTC+8</span>
        </div>
      </div>
    </aside>
    <div class="challenge-promise">
      <figure class="challenge-intro-copy">
        <blockquote><!-- INTRO --></blockquote>
        <figcaption><span aria-hidden="true">🤡</span><strong><!-- OWNER --></strong></figcaption>
      </figure>
      <img class="challenge-intro-gif" src="/media/intro.gif" width="439" height="439" alt="减肥大业的介绍动画">
    </div>
    <section class="challenge-log" aria-labelledby="challenge-log-title">
      <div class="challenge-progress" data-challenge-progress data-day-label="第 {day} 天 / 共 {total} 天" data-before="即将开始" data-after="挑战已结束"><span data-progress-label><!-- PROGRESS --></span></div>
      <div class="challenge-log-heading">
        <h2 id="challenge-log-title">每日记录</h2>
        <div class="challenge-view" role="group" aria-label="记录视图">
          <button type="button" class="challenge-view-option" data-view="list" aria-pressed="true" aria-controls="challenge-ledger" title="列表"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></svg><span class="visually-hidden">列表</span></button>
          <button type="button" class="challenge-view-option" data-view="calendar" aria-pressed="false" aria-controls="challenge-calendar" title="日历"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg><span class="visually-hidden">日历</span></button>
          <div class="challenge-view-active" aria-hidden="true"><span><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></svg></span><span><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg></span></div>
        </div>
        <ul class="challenge-legend" aria-label="记录类别">
          <li><i class="challenge-cell challenge-state--exercise" aria-hidden="true"></i>运动</li>
          <li><i class="challenge-cell challenge-state--diet" aria-hidden="true"></i>饮食</li>
        </ul>
      </div>
      <ol class="challenge-strip" aria-label="全部 28 天"><!-- CHALLENGE_STRIP --></ol>
      <div class="challenge-calendar" id="challenge-calendar">
        <div class="challenge-calendar-grid">
          <ol class="challenge-weekdays" aria-hidden="true"><li><span class="challenge-weekday-short">周一</span><span class="challenge-weekday-narrow">一</span></li><li><span class="challenge-weekday-short">周二</span><span class="challenge-weekday-narrow">二</span></li><li><span class="challenge-weekday-short">周三</span><span class="challenge-weekday-narrow">三</span></li><li><span class="challenge-weekday-short">周四</span><span class="challenge-weekday-narrow">四</span></li><li><span class="challenge-weekday-short">周五</span><span class="challenge-weekday-narrow">五</span></li><li><span class="challenge-weekday-short">周六</span><span class="challenge-weekday-narrow">六</span></li><li><span class="challenge-weekday-short">周日</span><span class="challenge-weekday-narrow">日</span></li></ol>
          <ol class="challenge-month" aria-label="{{calendarLabel}}"><!-- CHALLENGE_MONTH --></ol>
        </div>
        <div class="challenge-details"><!-- CHALLENGE_DETAILS --></div>
      </div>
      <ol class="challenge-ledger" id="challenge-ledger"><!-- CHALLENGE_LEDGER --></ol>
    </section>
  </main>
  <footer class="site-footer"><p><!-- OWNER --> · 28 天减肥记录</p></footer>
</div>
<dialog class="call-screen" id="call-screen" data-role="call-screen" aria-labelledby="call-screen-message">
  <button class="call-back" type="button" data-role="call-back" aria-label="返回" title="返回" autofocus>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
  </button>
  <p class="call-screen-message" id="call-screen-message">被 120 拉走也得把这 28 天扛完</p>
</dialog>
